<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the route | Cycler</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#ECEEE8;--road:#FFFFFF;--ink:#1C1C1A;--muted:#5D5C57;--plan:#2563EB;--rec:#E5484D;--hair:#D8DBD2}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 "Hanken Grotesk",system-ui,sans-serif;display:grid;place-items:center;padding:24px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;max-width:920px;width:100%}
h1{font:800 clamp(2.4rem,7vw,4.4rem)/.95 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.04em;margin:0 0 18px;text-wrap:balance}
p{margin:0 0 26px;color:var(--muted);max-width:40ch}
a.btn{display:inline-block;font-weight:600;padding:16px 22px;border-radius:14px;background:var(--ink);color:#fff;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--plan);outline-offset:3px}
.map{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--hair);aspect-ratio:5/4}
.map svg{display:block;width:100%;height:100%}
.cue{position:absolute;left:12px;top:12px;background:var(--road);border:1px solid var(--hair);border-radius:12px;padding:10px 14px;font-weight:600;box-shadow:0 2px 10px rgba(28,28,26,.08)}
.cue span{font-weight:400;color:var(--muted)}
@media(max-width:700px){main{grid-template-columns:1fr}}
</style>
<script defer src="/js/stats.js"></script>
</head>
<body>
<main>
  <div>
    <h1>You have left the route.</h1>
    <p>This page does not exist. In the app, Cycler would vibrate about now. Here, the way back is one tap.</p>
    <a class="btn" href="/">Back to the start</a>
  </div>
  <div class="map" aria-hidden="true">
    <svg viewBox="0 0 250 200">
      <rect width="250" height="200" fill="#ECEEE8"/>
      <g stroke="#fff" stroke-width="7"><path d="M-5 150H255M70 -5V205M-5 62H255M176 -5V205"/></g>
      <path d="M176 205V150H70V-5" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M176 205V150H120C110 150 104 128 118 112S150 96 142 80" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="142" cy="80" r="7" fill="#1C1C1A" stroke="#fff" stroke-width="3"/>
    </svg>
    <div class="cue">Off route <span>404 m from the line</span></div>
  </div>
</main>
</body>
</html>
